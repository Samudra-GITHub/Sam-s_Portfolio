<svg viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .f-bg { fill: #111215; }
      .f-text { fill: #fdf9f1; font-family: 'Inter', 'Segoe UI', sans-serif; }
      .f-mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }

      @keyframes treeReveal {
        0% { opacity: 0; transform: translateX(-8px); }
        100% { opacity: 1; transform: translateX(0); }
      }
      .tree-1 { animation: treeReveal 0.4s ease-out 0.1s both; }
      .tree-2 { animation: treeReveal 0.4s ease-out 0.2s both; }
      .tree-3 { animation: treeReveal 0.4s ease-out 0.3s both; }
      .tree-4 { animation: treeReveal 0.4s ease-out 0.4s both; }
      .tree-5 { animation: treeReveal 0.4s ease-out 0.5s both; }
      .tree-6 { animation: treeReveal 0.4s ease-out 0.6s both; }
      .tree-7 { animation: treeReveal 0.4s ease-out 0.7s both; }
      .tree-8 { animation: treeReveal 0.4s ease-out 0.8s both; }
      .tree-9 { animation: treeReveal 0.4s ease-out 0.9s both; }
      .tree-10 { animation: treeReveal 0.4s ease-out 1.0s both; }
      .tree-11 { animation: treeReveal 0.4s ease-out 1.1s both; }
      .tree-12 { animation: treeReveal 0.4s ease-out 1.2s both; }
      .tree-13 { animation: treeReveal 0.4s ease-out 1.3s both; }

      @keyframes branchGrow {
        0% { stroke-dashoffset: 20; }
        100% { stroke-dashoffset: 0; }
      }
      .branch {
        stroke: #fdf9f1;
        stroke-opacity: 0.1;
        stroke-width: 1;
        stroke-dasharray: 20;
        animation: branchGrow 0.6s ease-out both;
      }
    </style>
  </defs>

  <rect class="f-bg" width="1200" height="420" rx="10" />

  <!-- Title -->
  <text x="600" y="34" class="f-text f-mono" font-size="11" font-weight="600" text-anchor="middle" fill-opacity="0.35">FOLDER STRUCTURE</text>

  <!-- Left column: src/ -->
  <g class="tree-1">
    <text x="80" y="70" class="f-text f-mono" font-size="13" font-weight="700" fill="#d8f827">src/</text>
  </g>

  <g class="tree-2">
    <line class="branch" x1="88" y1="78" x2="88" y2="98" />
    <text x="100" y="95" class="f-text f-mono" font-size="11" font-weight="600" fill-opacity="0.7">lib/</text>
    <text x="160" y="95" class="f-text f-mono" font-size="9" fill-opacity="0.3">runtime, pointer, scroll, hooks, gsap setup</text>
  </g>

  <g class="tree-3">
    <line class="branch" x1="88" y1="98" x2="88" y2="128" />
    <text x="100" y="125" class="f-text f-mono" font-size="11" font-weight="600" fill-opacity="0.7">components/</text>
  </g>

  <g class="tree-4">
    <line class="branch" x1="116" y1="133" x2="116" y2="155" />
    <text x="130" y="152" class="f-text f-mono" font-size="10" fill-opacity="0.5">core/</text>
    <text x="200" y="152" class="f-text f-mono" font-size="9" fill-opacity="0.3">SmoothScroll, Cursor, Magnetic, ShaderCanvas, Split</text>
  </g>

  <g class="tree-5">
    <line class="branch" x1="116" y1="155" x2="116" y2="177" />
    <text x="130" y="175" class="f-text f-mono" font-size="10" fill-opacity="0.5">hero/</text>
    <text x="200" y="175" class="f-text f-mono" font-size="9" fill-opacity="0.3">stillness → throwable dot → ink takeover</text>
  </g>

  <g class="tree-6">
    <line class="branch" x1="116" y1="177" x2="116" y2="199" />
    <text x="130" y="197" class="f-text f-mono" font-size="10" fill-opacity="0.5">work/</text>
    <text x="200" y="197" class="f-text f-mono" font-size="9" fill-opacity="0.3">chapters (pinned + covering), SceneFrame, worlds/</text>
  </g>

  <g class="tree-7">
    <line class="branch" x1="116" y1="199" x2="116" y2="221" />
    <text x="130" y="219" class="f-text f-mono" font-size="10" fill-opacity="0.5">lab/</text>
    <text x="200" y="219" class="f-text f-mono" font-size="9" fill-opacity="0.3">five playable experiments (Ink, Kinetic, Pop, Momentum, Develop)</text>
  </g>

  <g class="tree-8">
    <line class="branch" x1="116" y1="221" x2="116" y2="243" />
    <text x="130" y="241" class="f-text f-mono" font-size="10" fill-opacity="0.5">about/</text>
    <text x="200" y="241" class="f-text f-mono" font-size="9" fill-opacity="0.3">the interactive desk</text>
  </g>

  <g class="tree-9">
    <line class="branch" x1="116" y1="243" x2="116" y2="265" />
    <text x="130" y="263" class="f-text f-mono" font-size="10" fill-opacity="0.5">contact/</text>
    <text x="210" y="263" class="f-text f-mono" font-size="9" fill-opacity="0.3">final tactile scene</text>
  </g>

  <g class="tree-10">
    <line class="branch" x1="116" y1="265" x2="116" y2="287" />
    <text x="130" y="285" class="f-text f-mono" font-size="10" fill="#d8f827" fill-opacity="0.6">kage/</text>
    <text x="200" y="285" class="f-text f-mono" font-size="9" fill-opacity="0.3">hidden door, KageSeed trigger (lazy)</text>
  </g>

  <g class="tree-11">
    <line class="branch" x1="88" y1="287" x2="88" y2="312" />
    <text x="100" y="310" class="f-text f-mono" font-size="11" font-weight="600" fill-opacity="0.7">pages/</text>
    <text x="180" y="310" class="f-text f-mono" font-size="9" fill-opacity="0.3">Home, ProjectDetail, NotFound</text>
  </g>

  <g class="tree-12">
    <line class="branch" x1="88" y1="312" x2="88" y2="337" />
    <text x="100" y="335" class="f-text f-mono" font-size="11" font-weight="600" fill-opacity="0.7">data/</text>
    <text x="160" y="335" class="f-text f-mono" font-size="9" fill-opacity="0.3">config, projects, playground</text>
  </g>

  <!-- Right column: supporting -->
  <g class="tree-1">
    <text x="660" y="70" class="f-text f-mono" font-size="13" font-weight="700" fill="#ff5226">backend/</text>
  </g>
  <g class="tree-3">
    <text x="672" y="95" class="f-text f-mono" font-size="10" fill-opacity="0.5">src/index.ts</text>
    <text x="790" y="95" class="f-text f-mono" font-size="9" fill-opacity="0.3">Express server · Resend · Zod · Helmet</text>
  </g>
  <g class="tree-4">
    <text x="672" y="118" class="f-text f-mono" font-size="10" fill-opacity="0.5">tests/api.test.ts</text>
    <text x="830" y="118" class="f-text f-mono" font-size="9" fill-opacity="0.3">node:test + supertest</text>
  </g>

  <g class="tree-5">
    <text x="660" y="160" class="f-text f-mono" font-size="13" font-weight="700" fill="#1e3ae8">scripts/</text>
  </g>
  <g class="tree-6">
    <text x="672" y="185" class="f-text f-mono" font-size="10" fill-opacity="0.5">sync-kage.mjs</text>
    <text x="810" y="185" class="f-text f-mono" font-size="9" fill-opacity="0.3">SHA-256 asset verification</text>
  </g>

  <g class="tree-7">
    <text x="660" y="227" class="f-text f-mono" font-size="13" font-weight="700" fill-opacity="0.5">public/</text>
  </g>
  <g class="tree-8">
    <text x="672" y="252" class="f-text f-mono" font-size="10" fill-opacity="0.5">favicon.svg</text>
    <text x="790" y="252" class="f-text f-mono" font-size="9" fill-opacity="0.3">custom brutalist icon</text>
  </g>
  <g class="tree-9">
    <text x="672" y="275" class="f-text f-mono" font-size="10" fill-opacity="0.5">icons.svg</text>
    <text x="780" y="275" class="f-text f-mono" font-size="9" fill-opacity="0.3">sprite sheet</text>
  </g>
  <g class="tree-10">
    <text x="672" y="298" class="f-text f-mono" font-size="10" fill="#d8f827" fill-opacity="0.6">landing-pages/</text>
    <text x="830" y="298" class="f-text f-mono" font-size="9" fill-opacity="0.3">Kage scene assets (synced from threeui)</text>
  </g>

  <g class="tree-11">
    <text x="660" y="340" class="f-text f-mono" font-size="13" font-weight="700" fill-opacity="0.5">config</text>
  </g>
  <g class="tree-12">
    <text x="672" y="365" class="f-text f-mono" font-size="10" fill-opacity="0.4">vercel.json · render.yaml · .gitignore · tsconfig.json</text>
  </g>

  <!-- Divider -->
  <line x1="630" y1="55" x2="630" y2="380" stroke="#fdf9f1" stroke-opacity="0.06" stroke-width="1" />

  <!-- Bottom -->
  <line x1="80" y1="395" x2="1130" y2="395" stroke="#fdf9f1" stroke-opacity="0.06" stroke-width="1" />
  <text x="600" y="412" class="f-text f-mono" font-size="9" text-anchor="middle" fill-opacity="0.2">110 files · 15,539 lines · zero dependencies on AI tooling at runtime</text>
</svg>
