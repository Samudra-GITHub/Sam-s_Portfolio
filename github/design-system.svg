<svg viewBox="0 0 1200 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .ds-bg { fill: #111215; }
      .ds-text { fill: #fdf9f1; font-family: 'Inter', 'Segoe UI', sans-serif; }
      .ds-mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }

      @keyframes swatchPop {
        0% { transform: scale(0); opacity: 0; }
        60% { transform: scale(1.1); }
        100% { transform: scale(1); opacity: 1; }
      }
      .sw-1 { animation: swatchPop 0.4s ease-out 0.1s both; }
      .sw-2 { animation: swatchPop 0.4s ease-out 0.2s both; }
      .sw-3 { animation: swatchPop 0.4s ease-out 0.3s both; }
      .sw-4 { animation: swatchPop 0.4s ease-out 0.4s both; }
      .sw-5 { animation: swatchPop 0.4s ease-out 0.5s both; }

      @keyframes borderDraw {
        0% { stroke-dashoffset: 280; }
        100% { stroke-dashoffset: 0; }
      }
      .border-draw {
        stroke-dasharray: 280;
        animation: borderDraw 1.5s ease-out 0.6s both;
      }
    </style>
  </defs>

  <rect class="ds-bg" width="1200" height="180" rx="10" />
  <text x="600" y="30" class="ds-text ds-mono" font-size="11" font-weight="600" text-anchor="middle" fill-opacity="0.35">DESIGN SYSTEM</text>

  <!-- Color Swatches -->
  <g class="sw-1">
    <rect x="80" y="52" width="70" height="70" rx="6" fill="#fdf9f1" stroke="#111215" stroke-width="3" />
    <text x="115" y="142" class="ds-text ds-mono" font-size="8" font-weight="600" text-anchor="middle" fill-opacity="0.5">Paper</text>
    <text x="115" y="155" class="ds-text ds-mono" font-size="7" text-anchor="middle" fill-opacity="0.25">#fdf9f1</text>
  </g>

  <g class="sw-2">
    <rect x="170" y="52" width="70" height="70" rx="6" fill="#111215" stroke="#fdf9f1" stroke-width="1" stroke-opacity="0.2" />
    <text x="205" y="142" class="ds-text ds-mono" font-size="8" font-weight="600" text-anchor="middle" fill-opacity="0.5">Ink</text>
    <text x="205" y="155" class="ds-text ds-mono" font-size="7" text-anchor="middle" fill-opacity="0.25">#111215</text>
  </g>

  <g class="sw-3">
    <rect x="260" y="52" width="70" height="70" rx="6" fill="#d8f827" stroke="#111215" stroke-width="3" />
    <text x="295" y="142" class="ds-text ds-mono" font-size="8" font-weight="600" text-anchor="middle" fill-opacity="0.5">Lime</text>
    <text x="295" y="155" class="ds-text ds-mono" font-size="7" text-anchor="middle" fill-opacity="0.25">#d8f827</text>
  </g>

  <g class="sw-4">
    <rect x="350" y="52" width="70" height="70" rx="6" fill="#1e3ae8" stroke="#111215" stroke-width="3" />
    <text x="385" y="142" class="ds-text ds-mono" font-size="8" font-weight="600" text-anchor="middle" fill-opacity="0.5">Cobalt</text>
    <text x="385" y="155" class="ds-text ds-mono" font-size="7" text-anchor="middle" fill-opacity="0.25">#1e3ae8</text>
  </g>

  <g class="sw-5">
    <rect x="440" y="52" width="70" height="70" rx="6" fill="#ff5226" stroke="#111215" stroke-width="3" />
    <text x="475" y="142" class="ds-text ds-mono" font-size="8" font-weight="600" text-anchor="middle" fill-opacity="0.5">Vermilion</text>
    <text x="475" y="155" class="ds-text ds-mono" font-size="7" text-anchor="middle" fill-opacity="0.25">#ff5226</text>
  </g>

  <!-- Typography -->
  <g>
    <text x="620" y="68" class="ds-text" font-size="22" font-weight="700" fill-opacity="0.8">Syne</text>
    <text x="700" y="68" class="ds-text ds-mono" font-size="9" fill-opacity="0.3">Display</text>

    <text x="620" y="95" class="ds-text" font-size="16" font-weight="400" fill-opacity="0.6">Epilogue</text>
    <text x="720" y="95" class="ds-text ds-mono" font-size="9" fill-opacity="0.3">Sans-serif</text>

    <text x="620" y="118" class="ds-text ds-mono" font-size="13" font-weight="600" fill-opacity="0.5">JetBrains Mono</text>
    <text x="790" y="118" class="ds-text ds-mono" font-size="9" fill-opacity="0.3">Monospace</text>
  </g>

  <!-- Physicality demo -->
  <g>
    <rect class="border-draw" x="950" y="55" width="60" height="60" rx="4" fill="#fdf9f1" fill-opacity="0.05" stroke="#fdf9f1" stroke-width="2" stroke-opacity="0.3" />
    <rect x="955" y="60" width="60" height="60" rx="4" fill="#111215" stroke="none" />
    <!-- Shadow -->
    <rect x="960" y="65" width="50" height="50" rx="3" fill="none" stroke="#d8f827" stroke-width="2" stroke-opacity="0.3" />
    <rect x="964" y="69" width="50" height="50" rx="3" fill="#111215" />
    <text x="989" y="99" class="ds-text ds-mono" font-size="7" text-anchor="middle" fill-opacity="0.4">2px</text>
    <text x="985" y="142" class="ds-text ds-mono" font-size="8" font-weight="600" text-anchor="middle" fill-opacity="0.5">Borders</text>
    <text x="985" y="155" class="ds-text ds-mono" font-size="7" text-anchor="middle" fill-opacity="0.25">hard + tactile</text>
  </g>

  <!-- Separator -->
  <line x1="590" y1="50" x2="590" y2="130" stroke="#fdf9f1" stroke-opacity="0.06" stroke-width="1" />
  <line x1="920" y1="50" x2="920" y2="130" stroke="#fdf9f1" stroke-opacity="0.06" stroke-width="1" />
</svg>
