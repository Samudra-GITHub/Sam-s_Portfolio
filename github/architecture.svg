<svg viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .a-bg { fill: #111215; }
      .a-text { fill: #fdf9f1; font-family: 'Inter', 'Segoe UI', sans-serif; }
      .a-mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }

      @keyframes fadeUp {
        0% { opacity: 0; transform: translateY(12px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      .fade-1 { animation: fadeUp 0.5s ease-out 0.1s both; }
      .fade-2 { animation: fadeUp 0.5s ease-out 0.3s both; }
      .fade-3 { animation: fadeUp 0.5s ease-out 0.5s both; }
      .fade-4 { animation: fadeUp 0.5s ease-out 0.7s both; }

      @keyframes arrowFlow {
        0% { stroke-dashoffset: 16; }
        100% { stroke-dashoffset: 0; }
      }
      .arrow-flow {
        stroke-dasharray: 8 4;
        animation: arrowFlow 1.2s linear infinite;
      }

      @keyframes boxPulse {
        0%, 100% { stroke-opacity: 0.15; }
        50% { stroke-opacity: 0.4; }
      }
      .box-pulse { animation: boxPulse 4s ease-in-out infinite; }
    </style>
  </defs>

  <rect class="a-bg" width="1200" height="320" rx="10" />

  <!-- Title -->
  <text x="600" y="34" class="a-text a-mono" font-size="11" font-weight="600" text-anchor="middle" fill-opacity="0.35">ARCHITECTURE</text>

  <!-- Browser -->
  <g class="fade-1">
    <rect x="80" y="55" width="200" height="80" rx="6" fill="#1e3ae8" fill-opacity="0.08" stroke="#1e3ae8" stroke-width="1.5" class="box-pulse" />
    <text x="180" y="88" class="a-text" font-size="14" font-weight="700" text-anchor="middle">Browser</text>
    <text x="180" y="108" class="a-text a-mono" font-size="9" text-anchor="middle" fill-opacity="0.4">React SPA · Vite</text>
    <text x="180" y="122" class="a-text a-mono" font-size="9" text-anchor="middle" fill-opacity="0.4">Custom cursor · Lenis</text>
  </g>

  <!-- Arrow Browser → Router -->
  <line class="arrow-flow" x1="280" y1="95" x2="370" y2="95" stroke="#d8f827" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- React Router -->
  <g class="fade-2">
    <rect x="370" y="55" width="200" height="80" rx="6" fill="#d8f827" fill-opacity="0.06" stroke="#d8f827" stroke-width="1.5" class="box-pulse" />
    <text x="470" y="88" class="a-text" font-size="14" font-weight="700" text-anchor="middle">Router</text>
    <text x="470" y="108" class="a-text a-mono" font-size="9" text-anchor="middle" fill-opacity="0.4">Home · ProjectDetail</text>
    <text x="470" y="122" class="a-text a-mono" font-size="9" text-anchor="middle" fill-opacity="0.4">NotFound · PageTransition</text>
  </g>

  <!-- Arrow Router → Scenes -->
  <line class="arrow-flow" x1="570" y1="95" x2="660" y2="95" stroke="#d8f827" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Scroll Scenes -->
  <g class="fade-3">
    <rect x="660" y="55" width="220" height="80" rx="6" fill="#ff5226" fill-opacity="0.06" stroke="#ff5226" stroke-width="1.5" class="box-pulse" />
    <text x="770" y="85" class="a-text" font-size="14" font-weight="700" text-anchor="middle">Scroll Scenes</text>
    <text x="770" y="105" class="a-text a-mono" font-size="9" text-anchor="middle" fill-opacity="0.4">GSAP ScrollTrigger</text>
    <text x="770" y="119" class="a-text a-mono" font-size="9" text-anchor="middle" fill-opacity="0.4">7 worlds · SceneFrame</text>
  </g>

  <!-- Arrow Scenes → Worlds -->
  <line class="arrow-flow" x1="880" y1="95" x2="960" y2="95" stroke="#d8f827" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- WebGL / Shader -->
  <g class="fade-4">
    <rect x="960" y="55" width="170" height="80" rx="6" fill="#ff5226" fill-opacity="0.12" stroke="#ff5226" stroke-width="1.5" class="box-pulse" />
    <text x="1045" y="88" class="a-text" font-size="14" font-weight="700" text-anchor="middle" fill="#ff5226">WebGL</text>
    <text x="1045" y="108" class="a-text a-mono" font-size="9" text-anchor="middle" fill-opacity="0.4">ShaderCanvas</text>
    <text x="1045" y="122" class="a-text a-mono" font-size="9" text-anchor="middle" fill-opacity="0.4">Akasha · Ink · Portfolio</text>
  </g>

  <!-- Second row -->
  <!-- Kage (lazy) -->
  <g class="fade-2">
    <rect x="80" y="175" width="200" height="80" rx="6" fill="#fdf9f1" fill-opacity="0.04" stroke="#fdf9f1" stroke-width="1" stroke-opacity="0.15" />
    <text x="180" y="208" class="a-text" font-size="14" font-weight="700" text-anchor="middle" fill-opacity="0.6">Kage</text>
    <text x="180" y="228" class="a-text a-mono" font-size="9" text-anchor="middle" fill-opacity="0.3">@designcodeio/threeui</text>
    <text x="180" y="242" class="a-text a-mono" font-size="9" text-anchor="middle" fill-opacity="0.3">Lazy loaded · SHA-256</text>
  </g>

  <!-- Lab experiments -->
  <g class="fade-3">
    <rect x="370" y="175" width="200" height="80" rx="6" fill="#fdf9f1" fill-opacity="0.04" stroke="#fdf9f1" stroke-width="1" stroke-opacity="0.15" />
    <text x="470" y="208" class="a-text" font-size="14" font-weight="700" text-anchor="middle" fill-opacity="0.6">Playground</text>
    <text x="470" y="228" class="a-text a-mono" font-size="9" text-anchor="middle" fill-opacity="0.3">Ink · Kinetic · Pop</text>
    <text x="470" y="242" class="a-text a-mono" font-size="9" text-anchor="middle" fill-opacity="0.3">Momentum · Develop</text>
  </g>

  <!-- Backend -->
  <g class="fade-3">
    <rect x="660" y="175" width="220" height="80" rx="6" fill="#d8f827" fill-opacity="0.08" stroke="#d8f827" stroke-width="1.5" class="box-pulse" />
    <text x="770" y="205" class="a-text" font-size="14" font-weight="700" text-anchor="middle" fill="#d8f827">Express Backend</text>
    <text x="770" y="225" class="a-text a-mono" font-size="9" text-anchor="middle" fill-opacity="0.4">Helmet · CORS · Rate Limit</text>
    <text x="770" y="239" class="a-text a-mono" font-size="9" text-anchor="middle" fill-opacity="0.4">Zod validation · Resend API</text>
  </g>

  <!-- Contact form arrow -->
  <line class="arrow-flow" x1="470" y1="135" x2="470" y2="175" stroke="#d8f827" stroke-width="1.5" stroke-opacity="0.2" />
  <line class="arrow-flow" x1="770" y1="135" x2="770" y2="175" stroke="#d8f827" stroke-width="1.5" stroke-opacity="0.2" />

  <!-- Resend -->
  <g class="fade-4">
    <rect x="960" y="175" width="170" height="80" rx="6" fill="#fdf9f1" fill-opacity="0.04" stroke="#fdf9f1" stroke-width="1" stroke-opacity="0.15" />
    <text x="1045" y="208" class="a-text" font-size="14" font-weight="700" text-anchor="middle" fill-opacity="0.6">Resend</text>
    <text x="1045" y="228" class="a-text a-mono" font-size="9" text-anchor="middle" fill-opacity="0.3">Email delivery</text>
    <text x="1045" y="242" class="a-text a-mono" font-size="9" text-anchor="middle" fill-opacity="0.3">Contact form → inbox</text>
  </g>

  <line class="arrow-flow" x1="880" y1="215" x2="960" y2="215" stroke="#d8f827" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Bottom accent line -->
  <line x1="80" y1="290" x2="1130" y2="290" stroke="#fdf9f1" stroke-opacity="0.06" stroke-width="1" />
  <text x="600" y="310" class="a-text a-mono" font-size="9" text-anchor="middle" fill-opacity="0.2">Static frontend on Vercel · Express backend on Render · Resend for email</text>
</svg>
