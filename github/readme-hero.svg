<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap');

      .hero-bg { fill: #111215; }
      .paper-tile { fill: #fdf9f1; stroke: #111215; stroke-width: 3; }
      .ink { fill: #111215; }
      .lime { fill: #d8f827; }
      .cobalt { fill: #1e3ae8; }
      .vermilion { fill: #ff5226; }
      .paper-text { fill: #fdf9f1; font-family: 'Inter', sans-serif; }
      .ink-text { fill: #111215; font-family: 'Inter', sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }

      /* Dot pulse */
      @keyframes pulse {
        0%, 100% { r: 12; opacity: 1; }
        50% { r: 18; opacity: 0.7; }
      }
      .dot-pulse { animation: pulse 2.4s ease-in-out infinite; }

      /* Title slide in */
      @keyframes slideIn {
        0% { opacity: 0; transform: translateY(30px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      .title-main { animation: slideIn 0.8s ease-out 0.2s both; }
      .title-sub { animation: slideIn 0.8s ease-out 0.5s both; }
      .title-tagline { animation: slideIn 0.8s ease-out 0.8s both; }

      /* Grid lines draw */
      @keyframes drawLine {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      .grid-line {
        stroke: #fdf9f1;
        stroke-opacity: 0.06;
        stroke-width: 1;
        stroke-dasharray: 400;
        animation: drawLine 3s ease-out both;
      }
      .grid-line:nth-child(2) { animation-delay: 0.1s; }
      .grid-line:nth-child(3) { animation-delay: 0.2s; }
      .grid-line:nth-child(4) { animation-delay: 0.3s; }
      .grid-line:nth-child(5) { animation-delay: 0.4s; }
      .grid-line:nth-child(6) { animation-delay: 0.5s; }
      .grid-line:nth-child(7) { animation-delay: 0.6s; }
      .grid-line:nth-child(8) { animation-delay: 0.7s; }

      /* Floating shapes */
      @keyframes float1 {
        0%, 100% { transform: translate(0, 0) rotate(0deg); }
        33% { transform: translate(8px, -12px) rotate(3deg); }
        66% { transform: translate(-5px, 6px) rotate(-2deg); }
      }
      @keyframes float2 {
        0%, 100% { transform: translate(0, 0) rotate(0deg); }
        33% { transform: translate(-10px, 8px) rotate(-4deg); }
        66% { transform: translate(6px, -8px) rotate(2deg); }
      }
      @keyframes float3 {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(5px, -10px); }
      }
      .float-1 { animation: float1 8s ease-in-out infinite; }
      .float-2 { animation: float2 10s ease-in-out infinite; }
      .float-3 { animation: float3 6s ease-in-out infinite; }

      /* Stamp rotation */
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .stamp-spin { animation: spin 30s linear infinite; transform-origin: 1060px 90px; }

      /* Ink spread */
      @keyframes inkSpread {
        0% { r: 0; opacity: 0; }
        40% { opacity: 0.08; }
        100% { r: 220; opacity: 0.04; }
      }
      .ink-spread { animation: inkSpread 4s ease-out 1s both; }

      /* Kicker bar */
      @keyframes kickerGrow {
        0% { width: 0; }
        100% { width: 60px; }
      }
      .kicker-bar { animation: kickerGrow 0.6s ease-out 0.4s both; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="hero-bg" width="1200" height="400" rx="12" />

  <!-- Grid lines -->
  <g>
    <line class="grid-line" x1="100" y1="0" x2="100" y2="400" />
    <line class="grid-line" x1="300" y1="0" x2="300" y2="400" />
    <line class="grid-line" x1="500" y1="0" x2="500" y2="400" />
    <line class="grid-line" x1="700" y1="0" x2="700" y2="400" />
    <line class="grid-line" x1="900" y1="0" x2="900" y2="400" />
    <line class="grid-line" x1="1100" y1="0" x2="1100" y2="400" />
    <line class="grid-line" x1="0" y1="100" x2="1200" y2="100" />
    <line class="grid-line" x1="0" y1="200" x2="1200" y2="200" />
    <line class="grid-line" x1="0" y1="300" x2="1200" y2="300" />
  </g>

  <!-- Ink spread circle -->
  <circle class="ink-spread" cx="600" cy="200" r="0" fill="#d8f827" />

  <!-- Floating accent shapes -->
  <g class="float-1">
    <rect x="40" y="40" width="50" height="50" fill="none" stroke="#1e3ae8" stroke-width="2" stroke-opacity="0.3" transform="rotate(15 65 65)" />
  </g>
  <g class="float-2">
    <rect x="1100" y="300" width="40" height="40" fill="#ff5226" fill-opacity="0.15" transform="rotate(-10 1120 320)" />
  </g>
  <g class="float-3">
    <circle cx="180" cy="320" r="6" fill="#1e3ae8" fill-opacity="0.2" />
  </g>
  <g class="float-1">
    <rect x="950" y="50" width="24" height="24" fill="#d8f827" fill-opacity="0.12" />
  </g>

  <!-- Spinning stamp circle -->
  <g class="stamp-spin">
    <circle cx="1060" cy="90" r="50" fill="none" stroke="#fdf9f1" stroke-width="1" stroke-opacity="0.08" />
    <text font-size="7" fill="#fdf9f1" fill-opacity="0.12" font-family="monospace" font-weight="600">
      <textPath href="#stamp-circ" textLength="290">HUMAN-CRAFTED · 0% BORING · SAMS STUDIO · 2026 · </textPath>
    </text>
  </g>
  <defs>
    <path id="stamp-circ" d="M1060,90 m-46,0 a46,46 0 1,1 92,0 a46,46 0 1,1 -92,0" />
  </defs>

  <!-- Kicker -->
  <g class="title-sub">
    <rect class="kicker-bar" x="80" y="118" height="3" fill="#d8f827" width="0" />
    <text x="150" y="122" class="paper-text mono" font-size="13" font-weight="600" fill-opacity="0.5">Creative developer &amp; designer</text>
  </g>

  <!-- Main title -->
  <g class="title-main">
    <text x="80" y="195" class="paper-text" font-size="72" font-weight="700" letter-spacing="-3">SAMUDRA</text>
    <text x="580" y="195" class="paper-text" font-size="72" font-weight="700" letter-spacing="-3">KAR</text>
    <text x="740" y="195" font-size="72" font-weight="700" letter-spacing="-3" fill="#d8f827">.</text>
  </g>

  <!-- Subtitle -->
  <g class="title-tagline">
    <text x="80" y="245" class="paper-text" font-size="18" font-weight="400" fill-opacity="0.6">Seven project worlds · playable experiments · one hidden door</text>
  </g>

  <!-- Bottom bar with tech labels -->
  <g class="title-tagline">
    <rect x="80" y="310" width="110" height="32" rx="4" fill="#fdf9f1" fill-opacity="0.08" stroke="#fdf9f1" stroke-opacity="0.1" stroke-width="1" />
    <text x="135" y="331" class="paper-text mono" font-size="11" font-weight="600" fill-opacity="0.5" text-anchor="middle">React 19</text>

    <rect x="200" y="310" width="90" height="32" rx="4" fill="#fdf9f1" fill-opacity="0.08" stroke="#fdf9f1" stroke-opacity="0.1" stroke-width="1" />
    <text x="245" y="331" class="paper-text mono" font-size="11" font-weight="600" fill-opacity="0.5" text-anchor="middle">Vite 8</text>

    <rect x="300" y="310" width="130" height="32" rx="4" fill="#fdf9f1" fill-opacity="0.08" stroke="#fdf9f1" stroke-opacity="0.1" stroke-width="1" />
    <text x="365" y="331" class="paper-text mono" font-size="11" font-weight="600" fill-opacity="0.5" text-anchor="middle">TypeScript</text>

    <rect x="440" y="310" width="110" height="32" rx="4" fill="#fdf9f1" fill-opacity="0.08" stroke="#fdf9f1" stroke-opacity="0.1" stroke-width="1" />
    <text x="495" y="331" class="paper-text mono" font-size="11" font-weight="600" fill-opacity="0.5" text-anchor="middle">GSAP 3</text>

    <rect x="560" y="310" width="160" height="32" rx="4" fill="#fdf9f1" fill-opacity="0.08" stroke="#fdf9f1" stroke-opacity="0.1" stroke-width="1" />
    <text x="640" y="331" class="paper-text mono" font-size="11" font-weight="600" fill-opacity="0.5" text-anchor="middle">Framer Motion</text>

    <rect x="730" y="310" width="110" height="32" rx="4" fill="#fdf9f1" fill-opacity="0.08" stroke="#fdf9f1" stroke-opacity="0.1" stroke-width="1" />
    <text x="785" y="331" class="paper-text mono" font-size="11" font-weight="600" fill-opacity="0.5" text-anchor="middle">WebGL</text>

    <rect x="850" y="310" width="90" height="32" rx="4" fill="#fdf9f1" fill-opacity="0.08" stroke="#fdf9f1" stroke-opacity="0.1" stroke-width="1" />
    <text x="895" y="331" class="paper-text mono" font-size="11" font-weight="600" fill-opacity="0.5" text-anchor="middle">Lenis</text>
  </g>

  <!-- Interactive lime dot with pulse -->
  <circle class="dot-pulse" cx="770" cy="180" r="12" fill="#d8f827" />

  <!-- Bottom border accent -->
  <rect x="0" y="394" width="1200" height="6" rx="0" fill="#d8f827" />
</svg>
