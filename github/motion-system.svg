<svg viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .m-bg { fill: #111215; }
      .m-text { fill: #fdf9f1; font-family: 'Inter', 'Segoe UI', sans-serif; }
      .m-mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }

      @keyframes waveBar {
        0%, 100% { height: 8; y: 196; }
        50% { height: 40; y: 164; }
      }
      .bar-1 { animation: waveBar 1.8s ease-in-out 0.0s infinite; }
      .bar-2 { animation: waveBar 1.8s ease-in-out 0.15s infinite; }
      .bar-3 { animation: waveBar 1.8s ease-in-out 0.3s infinite; }
      .bar-4 { animation: waveBar 1.8s ease-in-out 0.45s infinite; }
      .bar-5 { animation: waveBar 1.8s ease-in-out 0.6s infinite; }
      .bar-6 { animation: waveBar 1.8s ease-in-out 0.75s infinite; }
      .bar-7 { animation: waveBar 1.8s ease-in-out 0.9s infinite; }

      @keyframes cursorMorph {
        0%, 100% { rx: 4; width: 20; height: 20; }
        25% { rx: 10; width: 24; height: 24; }
        50% { rx: 2; width: 16; height: 28; }
        75% { rx: 12; width: 22; height: 22; }
      }
      .cursor-shape { animation: cursorMorph 4s ease-in-out infinite; }

      @keyframes orbit {
        0% { transform: rotate(0deg) translateX(30px) rotate(0deg); }
        100% { transform: rotate(360deg) translateX(30px) rotate(-360deg); }
      }
      .orbit-dot { animation: orbit 6s linear infinite; transform-origin: 600px 160px; }

      @keyframes inkDrip {
        0% { cy: 80; opacity: 1; r: 3; }
        70% { opacity: 1; }
        100% { cy: 210; opacity: 0; r: 1; }
      }
      .drip-1 { animation: inkDrip 2.5s ease-in 0s infinite; }
      .drip-2 { animation: inkDrip 2.5s ease-in 0.8s infinite; }
      .drip-3 { animation: inkDrip 2.5s ease-in 1.6s infinite; }

      @keyframes springBounce {
        0%, 100% { transform: translateY(0); }
        30% { transform: translateY(-14px); }
        50% { transform: translateY(4px); }
        70% { transform: translateY(-6px); }
        85% { transform: translateY(2px); }
      }
      .spring { animation: springBounce 3s ease-in-out infinite; }
    </style>
  </defs>

  <rect class="m-bg" width="1200" height="260" rx="10" />
  <text x="600" y="34" class="m-text m-mono" font-size="11" font-weight="600" text-anchor="middle" fill-opacity="0.35">MOTION SYSTEM</text>

  <!-- Scroll section -->
  <g>
    <text x="120" y="70" class="m-text" font-size="12" font-weight="700" text-anchor="middle" fill="#88CE02">GSAP</text>
    <text x="120" y="86" class="m-text m-mono" font-size="8" text-anchor="middle" fill-opacity="0.3">ScrollTrigger</text>
    <!-- Waveform bars -->
    <rect class="bar-1" x="70" y="196" width="8" height="8" rx="2" fill="#88CE02" fill-opacity="0.6" />
    <rect class="bar-2" x="82" y="196" width="8" height="8" rx="2" fill="#88CE02" fill-opacity="0.6" />
    <rect class="bar-3" x="94" y="196" width="8" height="8" rx="2" fill="#88CE02" fill-opacity="0.6" />
    <rect class="bar-4" x="106" y="196" width="8" height="8" rx="2" fill="#88CE02" fill-opacity="0.6" />
    <rect class="bar-5" x="118" y="196" width="8" height="8" rx="2" fill="#88CE02" fill-opacity="0.6" />
    <rect class="bar-6" x="130" y="196" width="8" height="8" rx="2" fill="#88CE02" fill-opacity="0.6" />
    <rect class="bar-7" x="142" y="196" width="8" height="8" rx="2" fill="#88CE02" fill-opacity="0.6" />
    <text x="120" y="230" class="m-text m-mono" font-size="8" text-anchor="middle" fill-opacity="0.2">pins · scrubs · masks</text>
  </g>

  <!-- Framer section -->
  <g>
    <text x="360" y="70" class="m-text" font-size="12" font-weight="700" text-anchor="middle" fill="#E847AE">Framer Motion</text>
    <text x="360" y="86" class="m-text m-mono" font-size="8" text-anchor="middle" fill-opacity="0.3">motion values</text>
    <g class="spring">
      <rect x="340" y="130" width="40" height="40" rx="8" fill="none" stroke="#E847AE" stroke-width="2" stroke-opacity="0.5" />
      <circle cx="360" cy="150" r="6" fill="#E847AE" fill-opacity="0.4" />
    </g>
    <text x="360" y="230" class="m-text m-mono" font-size="8" text-anchor="middle" fill-opacity="0.2">springs · drag · parallax</text>
  </g>

  <!-- Cursor section -->
  <g>
    <text x="600" y="70" class="m-text" font-size="12" font-weight="700" text-anchor="middle" fill="#d8f827">Cursor</text>
    <text x="600" y="86" class="m-text m-mono" font-size="8" text-anchor="middle" fill-opacity="0.3">8 states</text>
    <rect class="cursor-shape" x="590" y="140" width="20" height="20" fill="#d8f827" fill-opacity="0.5" />
    <circle class="orbit-dot" cx="600" cy="160" r="3" fill="#d8f827" fill-opacity="0.25" />
    <text x="600" y="230" class="m-text m-mono" font-size="8" text-anchor="middle" fill-opacity="0.2">morphs · magnetic · labels</text>
  </g>

  <!-- WebGL section -->
  <g>
    <text x="840" y="70" class="m-text" font-size="12" font-weight="700" text-anchor="middle" fill="#ff5226">WebGL</text>
    <text x="840" y="86" class="m-text m-mono" font-size="8" text-anchor="middle" fill-opacity="0.3">ShaderCanvas</text>
    <!-- Ink drops -->
    <circle class="drip-1" cx="820" cy="80" r="3" fill="#ff5226" fill-opacity="0.5" />
    <circle class="drip-2" cx="840" cy="80" r="3" fill="#ff5226" fill-opacity="0.5" />
    <circle class="drip-3" cx="860" cy="80" r="3" fill="#ff5226" fill-opacity="0.5" />
    <text x="840" y="230" class="m-text m-mono" font-size="8" text-anchor="middle" fill-opacity="0.2">shaders · DPR cap · context</text>
  </g>

  <!-- Lenis section -->
  <g>
    <text x="1080" y="70" class="m-text" font-size="12" font-weight="700" text-anchor="middle" fill="#1e3ae8">Lenis</text>
    <text x="1080" y="86" class="m-text m-mono" font-size="8" text-anchor="middle" fill-opacity="0.3">smooth scroll</text>
    <!-- Sine wave -->
    <path d="M1030,150 Q1050,120 1070,150 Q1090,180 1110,150 Q1130,120 1150,150" fill="none" stroke="#1e3ae8" stroke-width="2" stroke-opacity="0.4" stroke-linecap="round">
      <animate attributeName="d" dur="3s" repeatCount="indefinite"
        values="M1030,150 Q1050,120 1070,150 Q1090,180 1110,150 Q1130,120 1150,150;
                M1030,150 Q1050,180 1070,150 Q1090,120 1110,150 Q1130,180 1150,150;
                M1030,150 Q1050,120 1070,150 Q1090,180 1110,150 Q1130,120 1150,150" />
    </path>
    <text x="1080" y="230" class="m-text m-mono" font-size="8" text-anchor="middle" fill-opacity="0.2">velocity · momentum</text>
  </g>

  <!-- Bottom accent -->
  <rect x="0" y="254" width="1200" height="6" rx="0" fill="#d8f827" fill-opacity="0.15" />
</svg>
