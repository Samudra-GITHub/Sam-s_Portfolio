<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>B · Cinematic portal</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0}
  body{width:100vw;height:100vh;overflow:hidden;background:#f3f5f9;color:#0e2d72;font-family:Archivo,sans-serif;position:relative}
  .expose{position:absolute;inset:0;background:radial-gradient(42% 60% at 64% 50%,#123a8c 0 60%,#1a49a6 61% 70%,transparent 71%),#f3f5f9;}
  h1{position:absolute;left:4vw;top:22vh;font-stretch:125%;font-weight:800;font-size:12vw;line-height:.82;letter-spacing:-.04em;mix-blend-mode:difference;color:#eef2fc}
  .frame{position:absolute;right:6vw;bottom:10vh;width:26vw;aspect-ratio:4/5;border:1px solid #0e2d72;background:#123a8c}
  .frame::after{content:"";position:absolute;inset:18%;border-radius:50%;background:#eef2fc;opacity:.9}
  .cap{position:absolute;left:4vw;bottom:9vh;font:600 12px 'JetBrains Mono';letter-spacing:.12em;text-transform:uppercase}
  .bar{position:absolute;left:4vw;right:4vw;top:28px;display:flex;justify-content:space-between;font:600 12px 'JetBrains Mono';letter-spacing:.1em;text-transform:uppercase}
  .timer{position:absolute;left:4vw;bottom:15vh;font:600 46px 'JetBrains Mono'}
</style></head><body>
<div class="expose"></div>
<div class="bar"><span>Samudra Kar</span><span>Exposure 00:14 · scroll to develop</span></div>
<h1>SAMUDRA<br>KAR</h1>
<div class="frame"></div>
<p class="timer">01 / 09</p>
<p class="cap">Tarang · music, redesigned for the web · keep scrolling to expose the next print</p>
</body></html>
