<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Darkroom sketch</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0}
  body{width:1440px;height:900px;overflow:hidden;background:#7a1f0c;color:#ffcf9a;font-family:Archivo,sans-serif;position:relative}
  .strips{position:absolute;right:0;top:0;bottom:0;width:760px;display:flex}
  .strips div{flex:1}
  h1{position:absolute;left:40px;top:330px;font-stretch:110%;font-weight:800;font-size:120px;line-height:.86;text-transform:uppercase}
  .t{position:absolute;left:40px;top:40px;font:700 13px 'JetBrains Mono';letter-spacing:.14em}
  .timer{position:absolute;left:40px;bottom:60px;font:700 64px 'JetBrains Mono'}
  .print{position:absolute;right:120px;top:150px;width:520px;height:600px;background:#efe7da;border:16px solid #f6f1e8}
</style></head><body>
<p class="t">DEVELOPING · 7 PRINTS · SAM'S STUDIO</p>
<div class="strips"><div style="background:#2a0b05"></div><div style="background:#3b1308"></div><div style="background:#4c1a0b"></div><div style="background:#5d200d"></div><div style="background:#6c2410"></div></div>
<div class="print"></div>
<h1>Samudra<br>Kar</h1>
<p class="timer">00:42</p>
</body></html>
